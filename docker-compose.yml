services:
  mc:
    image: itzg/minecraft-server:latest
    pull_policy: daily
    tty: true
    stdin_open: true
    env_file:
      - .env
    environment:
      EULA: "TRUE"
    volumes:
      # attach the relative directory 'data' to the container's /data path
      - /var/lib/minecraft/data:/data
      - ./mods:/mods
      - /var/lib/minecraft/world:/world
    healthcheck:
      test: mc-health
      start_period: 1m
      interval: 5s
      retries: 20